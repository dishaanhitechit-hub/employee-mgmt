<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Portal — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo">
      <div class="logo-icon">👥</div>
      <div>
        <div style="font-size:18px;font-weight:800;">HR Portal</div>
        <div style="font-size:11px;color:var(--text-muted);">Powered by Acme Corp</div>
      </div>
    </div>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-sub">Sign in to your account to continue</p>

    <div id="login-error" class="login-error"></div>

    <form id="login-form" autocomplete="off">
      <label class="login-label" for="email">Email address</label>
      <input class="login-input" type="email" id="email" placeholder="you@acmecorp.io" required autocomplete="email" />

      <label class="login-label" for="password">Password</label>
      <input class="login-input" type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />

      <button class="login-btn" type="submit" id="login-btn">
        <span id="btn-text">Sign in</span>
      </button>
    </form>

    <div class="demo-creds">
      <strong>Demo accounts</strong><br />
      admin@acmecorp.io · Admin@123 (Super Admin)<br />
      hrmanager@acmecorp.io · Admin@123 (HR Manager)<br />
      manager@acmecorp.io · Admin@123 (Manager)<br />
      employee@acmecorp.io · Admin@123 (Employee)
    </div>
  </div>
</div>

<script>
  const API = '/api';

  // Redirect if already logged in
  if (localStorage.getItem('hr_access_token')) {
    window.location.href = '/dashboard.html';
  }

  document.getElementById('login-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('login-error');
    const btn   = document.getElementById('login-btn');
    const text  = document.getElementById('btn-text');
    errEl.style.display = 'none';
    btn.disabled = true;
    text.textContent = 'Signing in…';

    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    try {
      const res  = await fetch(`${API}/auth/login`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email, password }),
      });
      const json = await res.json();
      if (!json.success) throw new Error(json.message);

      const { access_token, refresh_token, user, permissions } = json.data;
      localStorage.setItem('hr_access_token',  access_token);
      localStorage.setItem('hr_refresh_token', refresh_token);
      localStorage.setItem('hr_user',          JSON.stringify(user));
      localStorage.setItem('hr_permissions',   JSON.stringify(permissions));

      window.location.href = '/dashboard.html';
    } catch (err) {
      errEl.textContent    = err.message || 'Login failed. Please try again.';
      errEl.style.display  = 'block';
      btn.disabled = false;
      text.textContent = 'Sign in';
    }
  });
</script>
</body>
</html>
