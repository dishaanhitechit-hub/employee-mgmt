<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Profile — HR Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app-shell">
  <nav class="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon">👥</div>
      <div><div class="logo-text">HR Portal</div><div class="logo-sub" id="org-name"></div></div>
    </div>
    <div class="sidebar-nav" id="sidebar-nav"></div>
    <div class="sidebar-footer" id="sidebar-user"></div>
  </nav>

  <div class="main-content">
    <header class="topbar">
      <div class="topbar-left">
        <a href="/employees.html" class="btn btn-ghost btn-sm">← Back</a>
        <div><div class="page-title" id="page-title">Employee Profile</div></div>
      </div>
    </header>

    <div class="page-body" id="profile-body">
      <div class="loading-overlay"><div class="spinner"></div><span>Loading profile…</span></div>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script>
  if (!requireAuth() || !canView('EMPLOYEES')) { window.location.href='/dashboard.html'; }

  const user = getUser();
  document.getElementById('org-name').textContent = user.org_name || '';
  buildSidebar('/employees.html');

  const params = new URLSearchParams(location.search);
  const empId  = params.get('id');

  if (!empId) { window.location.href = '/employees.html'; }

  async function loadProfile() {
    try {
      const { data: e } = await api.get(`/employees/${empId}`);
      document.getElementById('page-title').textContent = e.full_name;
      document.title = `${e.full_name} — HR Portal`;

      const body = document.getElementById('profile-body');
      body.innerHTML = `
        <!-- Profile header -->
        <div class="profile-header">
          <div class="profile-avatar">${initials(e.full_name)}</div>
          <div>
            <div class="profile-name">${e.full_name}</div>
            <div class="profile-sub">${e.designation || '—'} · ${e.department || '—'}</div>
            <div class="profile-badges">
              <span class="profile-badge">${e.employee_id}</span>
              <span class="profile-badge">${e.employment_status}</span>
              <span class="profile-badge">${e.employment_type}</span>
              <span class="profile-badge">${e.work_location || '—'}</span>
            </div>
          </div>
        </div>

        <div class="info-grid">
          <!-- Personal Info -->
          <div class="info-card">
            <div class="info-card-header">👤 Personal Information</div>
            <div class="info-card-body">
              <div class="info-row"><span class="info-label">Full Name</span><span class="info-value">${e.full_name}</span></div>
              <div class="info-row"><span class="info-label">Date of Birth</span><span class="info-value">${formatDate(e.date_of_birth)}</span></div>
              <div class="info-row"><span class="info-label">Email</span><span class="info-value">${e.email}</span></div>
              <div class="info-row"><span class="info-label">Phone</span><span class="info-value">${e.phone || '—'}</span></div>
            </div>
          </div>

          <!-- Employment Info -->
          <div class="info-card">
            <div class="info-card-header">💼 Employment Details</div>
            <div class="info-card-body">
              <div class="info-row"><span class="info-label">Employee ID</span><span class="info-value">${e.employee_id}</span></div>
              <div class="info-row"><span class="info-label">Designation</span><span class="info-value">${e.designation || '—'}</span></div>
              <div class="info-row"><span class="info-label">Department</span><span class="info-value">${e.department || '—'}</span></div>
              <div class="info-row"><span class="info-label">Employment Type</span><span class="info-value">${typeBadge(e.employment_type)}</span></div>
              <div class="info-row"><span class="info-label">Status</span><span class="info-value">${statusBadge(e.employment_status)}</span></div>
              <div class="info-row"><span class="info-label">Joining Date</span><span class="info-value">${formatDate(e.joining_date)}</span></div>
              <div class="info-row"><span class="info-label">Work Location</span><span class="info-value">${e.work_location || '—'}</span></div>
            </div>
          </div>

          <!-- Compensation -->
          <div class="info-card">
            <div class="info-card-header">💰 Compensation</div>
            <div class="info-card-body">
              <div class="info-row"><span class="info-label">Annual CTC</span>
                <span class="info-value" style="font-size:16px;font-weight:700;color:var(--primary);">${formatCurrency(e.annual_ctc)}</span>
              </div>
              <div class="info-row"><span class="info-label">Monthly Gross</span>
                <span class="info-value">${e.annual_ctc ? formatCurrency((e.annual_ctc / 12).toFixed(0)) : '—'}</span>
              </div>
            </div>
          </div>

          <!-- Reporting Manager -->
          <div class="info-card">
            <div class="info-card-header">🧑‍💼 Reporting Manager</div>
            <div class="info-card-body">
              ${e.manager_name ? `
                <div style="display:flex;align-items:center;gap:14px;padding:8px 0;">
                  <div class="table-avatar" style="width:44px;height:44px;font-size:15px;">${initials(e.manager_name)}</div>
                  <div>
                    <div style="font-weight:600;">${e.manager_name}</div>
                    <div style="font-size:12px;color:var(--text-muted);">${e.manager_designation || ''}</div>
                    <a href="/employee-detail.html?id=${e.manager_employee_id}" style="font-size:11px;color:var(--primary);">${e.manager_employee_id}</a>
                  </div>
                </div>` : '<div style="color:var(--text-muted);font-size:13px;padding:8px 0;">No manager assigned</div>'}
            </div>
          </div>

          <!-- Skills -->
          <div class="info-card" style="grid-column:1/-1;">
            <div class="info-card-header">🎯 Skills & Qualifications</div>
            <div class="info-card-body">
              ${e.skills?.length
                ? `<div class="skill-tags">${e.skills.map(s => `<span class="skill-tag">${s}</span>`).join('')}</div>`
                : '<span style="color:var(--text-muted);font-size:13px;">No skills listed</span>'}
            </div>
          </div>
        </div>
      `;
    } catch (err) {
      document.getElementById('profile-body').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <div class="empty-text">${err.message}</div>
          <a href="/employees.html" class="btn btn-ghost btn-sm" style="margin-top:12px;">← Back to list</a>
        </div>`;
    }
  }

  loadProfile();
</script>
</body>
</html>
